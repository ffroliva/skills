name: drift

# Weekly: is the snapshot behind the newest stable release? Needs no sbx install, only gh.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Compare the snapshot with the newest release
        id: compare
        run: |
          set +e
          line=$(python skills/sandbox-runbook/scripts/sbx_drift.py latest)
          code=$?
          set -e
          echo "$line"
          echo "line=$line" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) ;;
            4) echo "behind=true" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
      - name: Open or update the one drift issue
        if: steps.compare.outputs.behind == 'true'
        env:
          LINE: ${{ steps.compare.outputs.line }}
        run: |
          title="sbx drift: $LINE"
          body="Follow 'When this skill goes stale' in skills/sandbox-runbook/SKILL.md: run sbx_drift.py check, read the release notes between the versions, update what changed, then open a pull request."
          number=$(gh issue list --state open --search "sbx drift in:title author:app/github-actions" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --title "$title" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
